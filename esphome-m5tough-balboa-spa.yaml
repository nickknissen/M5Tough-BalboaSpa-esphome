# M5Tough Balboa Spa Monitor - Optimized Standalone ESPHome Configuration with MQTT
# Reduced CRC errors and improved communication stability
# Uses MQTT for Home Assistant integration instead of API

esphome:
  name: !secret device_name
  friendly_name: !secret friendly_name
  build_path: .build/esphome_m5tough_balboa_spa
  on_boot:
    priority: -100
    then:
      # Wait for HA time sync, then push current time to spa (Balboa has no RTC)
      - delay: 15s
      - button.press: spa_sync_time_button

# Pull time from Home Assistant so we can push it to the spa on boot
time:
  - platform: homeassistant
    id: ha_time
    timezone: "Europe/Copenhagen"

esp32:
  board: m5stack-core2
  framework:
    type: arduino

# Reduced logging to minimize interference with UART communication
logger:
  level: INFO
  baud_rate: 115200
  # Reduce logs that might interfere with spa communication
  logs:
    uart.arduino_esp32: WARN
    sensor: WARN
    template.sensor: WARN

# WiFi configuration using secrets
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# OPTIMIZED UART configuration for better CRC handling
uart:
  id: spa_uart_bus
  tx_pin: GPIO14 # Extension UART slot TX → RS485 Unit DI
  rx_pin: GPIO13 # Extension UART slot RX ← RS485 Unit RO
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  # Increased buffer sizes for better message handling
  rx_buffer_size: 1024
  # Enable hardware flow control if available
  # rts_pin: GPIO4  # Uncomment if you have RTS connected
  # cts_pin: GPIO5  # Uncomment if you have CTS connected

# External Balboa Spa component
external_components:
  - source:
      type: git
      url: https://github.com/brianfeucht/esphome-balboa-spa
      ref: main
    components: [balboa_spa]

# OPTIMIZED Balboa Spa component configuration
balboa_spa:
  id: spa
  spa_temp_scale: C
  esphome_temp_scale: C
  uart_id: spa_uart_bus

# Climate control with optimized settings
climate:
  - platform: balboa_spa
    balboa_spa_id: spa
    name: "Spa Thermostat"
    id: spa_thermostat
    visual:
      min_temperature: 15 °C
      max_temperature: 40 °C
      temperature_step: 0.5 °C

# Light stays as a switch — only jets had instability
switch:
  - platform: balboa_spa
    balboa_spa_id: spa
    light:
      name: "Spa Light"
      id: spa_light
      icon: "mdi:lightbulb"
      on_turn_on:
        - logger.log: "Light turned ON"
      on_turn_off:
        - logger.log: "Light turned OFF"

# Single massage pump exposed as a fan — switch platform caused on/off oscillation on BP21 boards
fan:
  - platform: balboa_spa
    balboa_spa_id: spa
    jet_1:
      name: "Spa Jet"
      id: spa_jet
      discard_updates: 20

# Core spa sensors with reduced update frequency
sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    
    # Heat state
    heatstate:
      name: "Spa Heat State"
      id: spa_heat_state
      icon: "mdi:thermometer"
      # Add filtering for stable readings
      filters:
        - throttle: 2s
    
    # Circulation pump
    circulation:
      name: "Spa Circulation"
      id: spa_circulation
      icon: "mdi:rotate-3d-variant"
      filters:
        - throttle: 5s
    
   
    # Rest mode
    restmode:
      name: "Spa Rest Mode"
      id: spa_rest_mode
      icon: "mdi:sleep"
      filters:
        - throttle: 5s

    # Fault log diagnostics
    fault_code:
      name: "Fault Code"
    fault_total_entries:
      name: "Fault Total Entries"
    fault_current_entry:
      name: "Fault Current Entry"
    fault_days_ago:
      name: "Fault Days Ago"

  # OPTIMIZED Template sensors with reduced update frequency
  - platform: template
    name: "Spa Current Temperature"
    id: spa_current_temp
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    # Reduced update frequency to minimize communication conflicts
    update_interval: 30s
    lambda: |-
      if (id(spa_thermostat).current_temperature != NAN) {
        return id(spa_thermostat).current_temperature;
      } else {
        return {};
      }
    filters:
      # Add filtering to smooth out readings
      - filter_out: nan
      - throttle: 10s

  - platform: template
    name: "Spa Target Temperature"
    id: spa_target_temp
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      if (id(spa_thermostat).target_temperature != NAN) {
        return id(spa_thermostat).target_temperature;
      } else {
        return {};
      }
    filters:
      - filter_out: nan
      - throttle: 10s

  # System sensors with reduced frequency
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 120s
    entity_category: diagnostic

# Binary sensors
binary_sensor:
  - platform: status
    name: "Device Status"
    entity_category: diagnostic

# Text sensors
text_sensor:
  - platform: balboa_spa
    balboa_spa_id: spa
    spa_time:
      name: "Spa Time"
    filter1_config:
      name: "Filter 1 Config"
    filter2_config:
      name: "Filter 2 Config"
    fault_message:
      name: "Fault Message"
    fault_log_time:
      name: "Fault Log Time"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic

# Writable text inputs to push time/filter settings back to the spa
text:
  - platform: balboa_spa
    balboa_spa_id: spa
    spa_time:
      name: "Set Spa Time"
      mode: TEXT
    filter1_start_time:
      name: "Set Filter 1 Start Time"
      mode: TEXT
    filter1_duration:
      name: "Set Filter 1 Duration"
      mode: TEXT
    filter2_start_time:
      name: "Set Filter 2 Start Time"
      mode: TEXT
    filter2_duration:
      name: "Set Filter 2 Duration"
      mode: TEXT

button:
  - platform: balboa_spa
    balboa_spa_id: spa
    sync_time:
      id: spa_sync_time_button
      name: "Sync Spa Time"
    request_fault_log:
      name: "Request Fault Log"

interval:
  - interval: 60s
    then:
      - logger.log: "Spa communication check - monitoring for stability"
